[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "1.0.0"
description = "Autonomous reconciliation and cash-position controller with a measured, auditable exception ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Khushi Bansal" }]
keywords = ["reconciliation", "finance", "accounting", "audit", "cash-forecast"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
  "License :: OSI Approved :: MIT License",
]
# No runtime dependencies. The deterministic core is stdlib-only on purpose:
# every score in it can be re-derived by hand during an audit.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
ledgerguard = "ledgerguard.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerguard*"]
