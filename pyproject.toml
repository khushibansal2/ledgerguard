[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "1.0.0"
description = "Autonomous reconciliation and cash-position controller with a measured, auditable exception ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Khushi Bansal" }]
keywords = ["reconciliation", "finance", "accounting", "audit", "cash-forecast"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
  "License :: OSI Approved :: MIT License",
]
# No dependencies at all - not even for the optional LLM planner, which speaks
# the OpenAI chat-completions dialect over urllib. Every score in the
# deterministic core can be re-derived by hand during an audit, and nothing
# here pins a vendor.
dependencies = []

[project.scripts]
ledgerguard = "ledgerguard.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerguard*"]
