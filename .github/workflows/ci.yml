name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Invariants
        run: python tests/test_controller.py

      # The accuracy claims in the README are checked here, not trusted.
      # If a change regresses precision or starts dropping records, CI fails.
      # The model slot is the only untrusted input in the pipeline. This
      # asserts a hostile planner cannot move the ledger, only waste tool calls.
      - name: Adversarial planner containment
        run: python -m ledgerguard.redteam 20

      - name: Accuracy regression gate
        run: python -m ledgerguard.verify_claims

      # The README is hand-written and so can drift from the run it describes.
      # This asserts every published figure still matches the committed output.
      - name: Published figures match run output
        run: python -m ledgerguard.check_readme
