# Render blueprint. One service, no dependencies to install.
#
# The demo page runs the engine client-side under Pyodide, so it keeps working
# while a free-tier instance is cold; the API is for scripting a close or
# proving the same numbers come out of a server as out of the CLI.
services:
  - type: web
    name: ledgerguard
    runtime: python
    plan: free
    region: singapore
    # Regenerates the demo page from library source at deploy time, so what is
    # served can never drift from the code it claims to run.
    buildCommand: python -m ledgerguard.build_web
    startCommand: python -m ledgerguard.server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"

      # Endpoint and model are configuration, not secrets, so they live here.
      - key: LEDGERGUARD_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LEDGERGUARD_MODEL
        value: qwen/qwen3.8-27b

      # sync: false means Render prompts for this in the dashboard and stores it
      # encrypted. It is deliberately absent from the repository: a key committed
      # to git is a key you have published, and rewriting history does not
      # un-publish it. The service runs without this - the built-in planner
      # produces the same hypothesis set - so a missing key degrades the model
      # path rather than breaking the close.
      - key: LEDGERGUARD_API_KEY
        sync: false
